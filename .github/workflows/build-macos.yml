name: macOS builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-appkit-macos:
    name: Build (AppKit ${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86_64
            runner: macos-26-intel
          - label: arm64
            runner: macos-26

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: brew install ccache ninja
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1

      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ccache
          key: ccache-macos-${{ matrix.label }}-${{ github.sha }}
          restore-keys: |
            ccache-macos-${{ matrix.label }}-

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DWERROR=ON \
            -DCMAKE_C_FLAGS="-Wno-deprecated-declarations" \
            -DBACKEND=appkit \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Upload raw binary
        uses: actions/upload-artifact@v7
        with:
          name: butterscotch-${{ matrix.label }}
          path: build/butterscotch

  package-universal:
    name: Package universal release
    needs: build-appkit-macos
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Download arm64 binary
        uses: actions/download-artifact@v7
        with:
          name: butterscotch-arm64
          path: bin-arm64

      - name: Download x86_64 binary
        uses: actions/download-artifact@v7
        with:
          name: butterscotch-x86_64
          path: bin-x86_64

      - name: Create universal binary and package
        run: |
          set -e
          pkg="VA-11-Hall-A-64bit-universal"
          mkdir -p dist-bin
          lipo -create bin-arm64/butterscotch bin-x86_64/butterscotch -output dist-bin/butterscotch-universal
          lipo -info dist-bin/butterscotch-universal
          chmod +x dist-bin/butterscotch-universal
          codesign --force --sign - dist-bin/butterscotch-universal
          version="1.1.0-preview"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          packaging/build-pkg.sh "$version" dist-bin/butterscotch-universal
          mkdir -p "pkg/$pkg"
          cp dist-bin/butterscotch-universal "pkg/$pkg/butterscotch"
          cp install.sh uninstall.sh README.md README.zh-CN.md RELEASE_NOTES.md LICENSE "pkg/$pkg/"
          cp "Install VA-11 Hall-A 64bit.command" "pkg/$pkg/"
          chmod +x "pkg/$pkg/butterscotch" "pkg/$pkg/install.sh" "pkg/$pkg/uninstall.sh" "pkg/$pkg/Install VA-11 Hall-A 64bit.command"
          cd pkg && zip -r "$pkg.zip" "$pkg"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: VA-11-Hall-A-64bit-universal
          path: |
            pkg/VA-11-Hall-A-64bit-universal.zip
            dist-bin/VA-11-Hall-A-64bit-universal.pkg

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "${GITHUB_REF_NAME}" "pkg/VA-11-Hall-A-64bit-universal.zip" "dist-bin/VA-11-Hall-A-64bit-universal.pkg" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: macOS builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      package_version:
        description: Version embedded in the PKG receipt
        required: false
        default: 1.1.0-preview

permissions:
  contents: write

jobs:
  build-appkit-macos:
    name: Build (AppKit ${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86_64
            runner: macos-26-intel
          - label: arm64
            runner: macos-26

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: brew install ccache ninja
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1

      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ccache
          key: ccache-macos-${{ matrix.label }}-${{ github.sha }}
          restore-keys: |
            ccache-macos-${{ matrix.label }}-

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DWERROR=ON \
            -DCMAKE_C_FLAGS="-Wno-deprecated-declarations" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DBACKEND=appkit \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Verify deployment target
        run: |
          minos="$(otool -l build/butterscotch | awk '/cmd LC_BUILD_VERSION/{found=1; next} found && $1=="minos"{print $2; exit}')"
          test "$minos" = "11.0"
          echo "Minimum macOS: $minos"

      - name: Upload raw binary
        uses: actions/upload-artifact@v7
        with:
          name: butterscotch-${{ matrix.label }}
          path: build/butterscotch

  package-universal:
    name: Package universal release
    needs: build-appkit-macos
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Download arm64 binary
        uses: actions/download-artifact@v7
        with:
          name: butterscotch-arm64
          path: bin-arm64

      - name: Download x86_64 binary
        uses: actions/download-artifact@v7
        with:
          name: butterscotch-x86_64
          path: bin-x86_64

      - name: Create universal binary and package
        run: |
          set -e
          pkg="VA-11-Hall-A-64bit-universal"
          mkdir -p dist-bin
          lipo -create bin-arm64/butterscotch bin-x86_64/butterscotch -output dist-bin/butterscotch-universal
          lipo -info dist-bin/butterscotch-universal
          for arch in arm64 x86_64; do
            minos="$(otool -arch "$arch" -l dist-bin/butterscotch-universal | awk '/cmd LC_BUILD_VERSION/{found=1; next} found && $1=="minos"{print $2; exit}')"
            test "$minos" = "11.0"
            echo "$arch minimum macOS: $minos"
          done
          chmod +x dist-bin/butterscotch-universal
          codesign --force --sign - dist-bin/butterscotch-universal
          version="${{ github.event.inputs.package_version || '1.1.0-preview' }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          packaging/build-pkg.sh "$version" dist-bin/butterscotch-universal
          mkdir -p "pkg/$pkg"
          cp -X dist-bin/butterscotch-universal "pkg/$pkg/butterscotch"
          cp -X vendor/steamworks/redistributable_bin/osx/libsteam_api.dylib "pkg/$pkg/libsteam_api.dylib"
          cp -X install.sh uninstall.sh README.md README.zh-CN.md RELEASE_NOTES.md LICENSE "pkg/$pkg/"
          cp -X "Install VA-11 Hall-A 64bit.command" "pkg/$pkg/"
          chmod +x "pkg/$pkg/butterscotch" "pkg/$pkg/libsteam_api.dylib" "pkg/$pkg/install.sh" "pkg/$pkg/uninstall.sh" "pkg/$pkg/Install VA-11 Hall-A 64bit.command"
          xattr -cr "pkg/$pkg"
          find "pkg/$pkg" -name '._*' -delete
          cd pkg
          COPYFILE_DISABLE=1 zip -X -r "$pkg.zip" "$pkg"
          if unzip -Z1 "$pkg.zip" | grep -Eq '(^|/)\._'; then
            echo "AppleDouble file found in ZIP" >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: VA-11-Hall-A-64bit-universal
          path: |
            pkg/VA-11-Hall-A-64bit-universal.zip
            dist-bin/VA-11-Hall-A-64bit-universal.pkg
            uninstall.sh

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "${GITHUB_REF_NAME}" "pkg/VA-11-Hall-A-64bit-universal.zip" "dist-bin/VA-11-Hall-A-64bit-universal.pkg" uninstall.sh --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
